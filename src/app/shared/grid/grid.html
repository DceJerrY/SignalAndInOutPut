<p-table [value]="this.persons()" showGridlines stripedRows>
    <ng-template #header>
        <tr>
            <th>Nombre</th>
            <th>Apellido</th>
        </tr>
    </ng-template>
    <ng-template #body let-person>
        <tr>
            <td>{{ person.name }}</td>
            <td>{{ person.lastName }}</td>
            <td>
                <button pButton type="button" severity="danger" icon="pi pi-trash" pTooltip="Eliminar" tooltipPosition="top"
                    class="p-button-rounded p-button-info mr-2" (click)="delete(person.code)">
                </button>
            </td>
        </tr>
    </ng-template>
</p-table>
